<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOOI|沐意美睫線上預約</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #5A4038;
      --ink-soft: #A3877B;
      --bg: #FFF3EE;
      --bg-alt: #FFE6DC;
      --card: #FFFFFF;
      --line: #FFDCCF;
      --accent: #E0A458;
      --accent-deep: #C6852E;
      --peach: #C6852E;
      --mint: #6FCDB0;
      --mint-tint: #E7F8F1;
      --coral: #FF8177;
      --coral-tint: #FFEEEA;
      --shadow: 0 14px 28px -16px rgba(198, 133, 46, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 10% 0%, rgba(224,164,88,0.14), transparent 42%),
        radial-gradient(circle at 95% 100%, rgba(111,205,176,0.16), transparent 45%);
      color: var(--ink);
      max-width: 600px;
      margin: 0 auto;
      padding: 32px 20px 60px;
      line-height: 1.6;
    }

    /* ---------- Header ---------- */
    .brand { text-align: center; margin-bottom: 30px; }
    .brand .sparkle { font-size: 26px; letter-spacing: 10px; display: block; margin-bottom: 6px; }
    h2.title {
      font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
      font-weight: 800;
      font-size: 27px;
      letter-spacing: 0.02em;
      margin: 0 0 8px;
      color: var(--accent-deep);
    }
    .tagline { font-size: 13.5px; color: var(--ink-soft); margin: 0; font-weight: 500; }

    /* ---------- Cards ---------- */
    .card {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 24px;
      padding: 24px 22px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .eyebrow {
      font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
    }
    .eyebrow .num {
      font-size: 13px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
      border-radius: 999px;
      width: 24px; height: 24px;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      box-shadow: 0 4px 10px -3px rgba(198,133,46,0.6);
    }

    /* ---------- Form ---------- */
    .form-group { margin-bottom: 16px; }
    .form-group:last-child { margin-bottom: 0; }
    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 13.5px;
      color: var(--ink-soft);
    }
    input[type="text"], input[type="tel"], input[type="date"], select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--line);
      background: #FFFCFB;
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      color: var(--ink);
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(224,164,88,0.18);
    }
    input::placeholder { color: #D6B7AC; }

    .quick-fill {
      font-size: 12px;
      color: var(--accent-deep);
      cursor: pointer;
      font-weight: 700;
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-alt);
      padding: 5px 12px;
      border-radius: 999px;
      transition: transform .15s ease;
    }
    .quick-fill:hover { transform: scale(1.05); }

    .history-note {
      display: none;
      margin-top: 10px;
      background: var(--bg-alt);
      color: var(--accent-deep);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1.5px dashed var(--accent);
    }

    /* ---------- Monthly calendar (date picker) ---------- */
    .calendar-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .btn-nav {
      background: var(--bg-alt); color: var(--accent-deep); border: none;
      width: 32px; height: 32px; border-radius: 999px; font-size: 16px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform .15s ease;
    }
    .btn-nav:hover { transform: scale(1.12); }
    .month-label { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 16px; color: var(--ink); }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .calendar-weekday { text-align: center; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); padding-bottom: 4px; }
    .calendar-day {
      min-height: 54px;
      border-radius: 11px;
      border: 2px solid var(--line);
      padding: 5px 4px;
      cursor: pointer;
      background: #FFFCFB;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all .15s ease;
    }
    .calendar-day:hover { transform: translateY(-2px) scale(1.03); }
    .calendar-day.empty { visibility: hidden; cursor: default; }
    .calendar-day .day-num { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 12.5px; color: var(--ink); }
    .calendar-day .day-status { font-size: 9px; margin-top: auto; font-weight: 700; }
    .calendar-day.today { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(224,164,88,0.25); }
    .calendar-day.selected { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%); border-color: var(--accent-deep); }
    .calendar-day.selected .day-num, .calendar-day.selected .day-status { color: #fff; }
    .calendar-day.cal-off { background: var(--bg-alt); cursor: default; }
    .calendar-day.cal-off .day-status { color: var(--ink-soft); }
    .calendar-day.cal-full { background: var(--coral-tint); border-color: var(--coral); cursor: default; }
    .calendar-day.cal-full .day-status { color: #B04A3F; }
    .calendar-day.cal-open { background: var(--mint-tint); border-color: var(--mint); }
    .calendar-day.cal-open .day-status { color: #3E7A66; }
    .calendar-day.cal-past { opacity: 0.4; cursor: default; }

    /* ---------- Slot grid ---------- */
    .slot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .slot-btn {
      padding: 13px 6px;
      border: 2px solid var(--line);
      background: #FFFCFB;
      border-radius: 14px;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      transition: all .16s ease;
    }
    .slot-btn:hover { border-color: var(--accent); transform: translateY(-2px) scale(1.02); }
    .slot-btn.selected {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
      color: #fff;
      border-color: var(--accent-deep);
      font-weight: 700;
      box-shadow: 0 6px 14px -6px rgba(198,133,46,0.6);
    }
    .slot-btn.disabled {
      background: var(--bg-alt);
      color: #E0B8AC;
      cursor: not-allowed;
      border-style: dashed;
    }

    /* ---------- Option list ---------- */
    .option-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 6px;
      border-bottom: 1.5px dashed var(--line);
      font-size: 14.5px;
    }
    .option-item:last-child { border-bottom: none; }
    .option-item label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      margin-bottom: 0;
    }
    .option-item input[type="radio"], .option-item input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--accent-deep);
      cursor: pointer;
    }
    .option-item .price {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      color: var(--accent-deep);
      font-size: 14px;
      white-space: nowrap;
    }

    /* ---------- Total / submit ---------- */
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 2px dashed var(--line);
    }
    .total-label { font-size: 14px; color: var(--ink-soft); font-weight: 700; }
    .total-value {
      font-family: 'Baloo 2', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--accent-deep);
    }
    .total-value .currency { font-size: 15px; color: var(--peach); margin-right: 3px; }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
      color: #fff;
      padding: 16px;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      font-family: 'Baloo 2', sans-serif;
      cursor: pointer;
      box-shadow: 0 10px 22px -8px rgba(198,133,46,0.6);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn-submit:hover { transform: translateY(-2px) scale(1.01); }
    .btn-submit:active { transform: translateY(0) scale(0.99); }

    .empty-note { color: var(--ink-soft); font-size: 13.5px; text-align: center; padding: 10px 0; }
  </style>
</head>
<body>

  <div class="brand">
    <span class="sparkle">✨ 🌼 ✨</span>
    <h2 class="title">MOOI|沐意美睫線上預約</h2>
    <p class="tagline">選定時段，交給我們把細節做好</p>
  </div>

  <!-- 1. 個人資訊 -->
  <div class="card">
    <h3 class="eyebrow">
      <span class="num">1</span> 個人資訊
      <span class="quick-fill" id="btnQuickFill" style="display:none;" onclick="loadSavedCustomer()">⚡ 帶入上次資料</span>
    </h3>
    <div class="form-group">
      <label>姓名 *</label>
      <input type="text" id="custName" placeholder="請輸入姓名" required>
    </div>
    <div class="form-group">
      <label>電話 *</label>
      <input type="tel" id="custPhone" placeholder="請輸入手機號碼" required onchange="checkReturningCustomer()">
      <p class="history-note" id="historyNote"></p>
    </div>
    <div class="form-group">
      <label>LINE ID</label>
      <input type="text" id="custLine" placeholder="方便聯繫溝通（選填）">
    </div>
  </div>

  <!-- 2. 月曆與時段選擇 -->
  <div class="card">
    <h3 class="eyebrow"><span class="num">2</span> 選擇日期與時段</h3>
    <div class="form-group">
      <label>選擇日期 *</label>
      <div class="calendar-nav">
        <button type="button" class="btn-nav" onclick="changeCalMonth(-1)">‹</button>
        <span class="month-label" id="calMonthLabel">載入中...</span>
        <button type="button" class="btn-nav" onclick="changeCalMonth(1)">›</button>
      </div>
      <div class="calendar-grid">
        <div class="calendar-weekday">日</div>
        <div class="calendar-weekday">一</div>
        <div class="calendar-weekday">二</div>
        <div class="calendar-weekday">三</div>
        <div class="calendar-weekday">四</div>
        <div class="calendar-weekday">五</div>
        <div class="calendar-weekday">六</div>
      </div>
      <div class="calendar-grid" id="calendarGrid" style="margin-top: 5px;">
        <p class="empty-note" style="grid-column: 1/-1;">載入中...</p>
      </div>
      <input type="hidden" id="bookingDate">
    </div>
    <label>可預約時段 *</label>
    <div class="slot-grid" id="slotsContainer">
      <p class="empty-note" style="grid-column: 1/-1;">請先在月曆選擇日期</p>
    </div>
  </div>

  <!-- 3. 款式與加購選擇 -->
  <div class="card">
    <h3 class="eyebrow"><span class="num">3</span> 款式與加購</h3>
    <div class="form-group">
      <label>美睫款式 *</label>
      <div id="styleOptions">載入中...</div>
    </div>
    <div class="form-group" style="margin-top:18px;">
      <label>加購項目（複選）</label>
      <div id="addonOptions">載入中...</div>
    </div>
  </div>

  <!-- 4. 總計與送出 -->
  <div class="card" id="formCard4">
    <div class="total-row">
      <span class="total-label">預計金額</span>
      <span class="total-value"><span class="currency">NT$</span><span id="totalPrice">0</span></span>
    </div>
    <button class="btn-submit" onclick="submitBooking()">確認並送出預約 🌸</button>
  </div>

  <!-- 5. 預約成功後的快速聯繫（預設隱藏，送出成功才顯示） -->
  <div class="card" id="confirmCard" style="display:none;">
    <h3 class="eyebrow">🎉 預約成功</h3>
    <p id="confirmSummary" style="white-space: pre-line; font-size: 14px; line-height: 1.9; background: var(--bg-alt); padding: 14px 16px; border-radius: 14px; margin: 0 0 16px;"></p>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <button class="btn-submit" onclick="sendToLine()">📩 傳送預約資訊到 LINE</button>
      <button class="btn-submit" style="background: linear-gradient(135deg, var(--mint) 0%, #4FAE90 100%); box-shadow: 0 10px 22px -8px rgba(111,205,176,0.55);" onclick="copySummary()">📋 複製預約摘要</button>
      <span class="quick-fill" style="align-self: center;" onclick="location.reload()">重新填寫下一筆預約</span>
    </div>
  </div>

  <script>
    // 🔗 請替換為你自己的 Supabase URL 與 Anon Key
    const SUPABASE_URL = 'https://tlnodsjkpvupuxlbkuoy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsbm9kc2prcHZ1cHV4bGJrdW95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MTk2NzUsImV4cCI6MjEwMTk5NTY3NX0.czGHw2bokxTWga5wvxKlQdUAogkRZV6PkYmMPaYFPEE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedTimeSlot = '';
    let selectedStyle = null;
    let selectedAddons = [];
    let stylesData = [];
    let addonsData = [];

    // 月曆目前顯示的年/月（month 為 0-11）
    let calYear, calMonth;

    // 預設常見時段（月曆總覽與時段清單共用）
    const DEFAULT_SLOTS = ['9:00', '9:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00', '19:30', '20:00'];

    // ---------- LINE 好友身份 (LIFF) ----------
    // 👉 到 LINE Developers Console 建立 LIFF App 後，把 LIFF ID 貼在這裡即可啟用；
    //    沒有填的話會自動略過，不影響其他功能。
    const LIFF_ID = 'Y2011072988-Nzr1UAfi';
    let lineProfile = null; // { userId, displayName, pictureUrl }

    // 👉 你的 LINE 官方帳號 ID（在 LINE 官方帳號管理後台「設定」可查到，格式如 @abc1234）
    //    填了之後，客人送出預約後可以一鍵把資料傳到你的 LINE，完全免費、不需要額外申請。
    const LINE_OA_ID = '@525kfdtx';
    let lastBookingSummary = '';

    // 👉 部署好 send-line-confirmation 這個 Supabase Edge Function 後，把網址貼在這裡，
    //    就能在客人是從 LINE 進來（有抓到 LIFF userId）時自動推播預約成功訊息。
    //    沒填的話會自動略過，改用上面「客人手動傳送」的按鈕，不影響其他功能。
    const LINE_PUSH_FUNCTION_URL = '';

    async function initLiff() {
      if (!LIFF_ID || LIFF_ID.includes('Y2011072988-Nzr1UAfi')) return; // 尚未設定 LIFF，略過
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          lineProfile = await liff.getProfile();
          // 姓名欄位若還是空的，用 LINE 暱稱幫忙帶入（顧客仍可自行修改）
          const nameInput = document.getElementById('custName');
          if (nameInput && !nameInput.value && lineProfile.displayName) {
            nameInput.value = lineProfile.displayName;
          }
        } else if (liff.isInClient()) {
          // 在 LINE App 內開啟但尚未登入，導向登入
          liff.login();
        }
      } catch (e) {
        console.warn('LIFF 初始化失敗：', e);
      }
    }

    // ---------- 流量來源判斷 (IG / LINE / 其他) ----------
    // 在 IG 簡介連結後面加 ?source=instagram，LINE 訊息連結加 ?source=line，
    // 就能知道這筆預約是從哪個管道進來的（IG 沒有辦法拿到訪客身份，只能標記來源）。
    function detectTrafficSource() {
      const params = new URLSearchParams(window.location.search);
      const fromParam = params.get('source');
      if (fromParam) return fromParam;

      const ref = document.referrer || '';
      if (ref.includes('instagram.com')) return 'instagram';
      if (ref.includes('line.me') || ref.includes('liff.line.me')) return 'line';
      if (ref.includes('facebook.com')) return 'facebook';
      if (ref) return 'referral';
      return 'direct';
    }
    let trafficSource = 'direct';

    // 初始化頁面
    window.onload = async () => {
      trafficSource = detectTrafficSource();
      await initLiff();
      checkSavedCustomer();
      await fetchStylesAndAddons();

      // 預設日期為明天
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      calYear = tomorrow.getFullYear();
      calMonth = tomorrow.getMonth();

      await loadMonthCalendar();
      selectCalendarDay(tomorrow.toISOString().split('T')[0]);
    };

    function pad2(n) { return String(n).padStart(2, '0'); }

    // 切換月曆顯示的月份
    function changeCalMonth(delta) {
      calMonth += delta;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      if (calMonth > 11) { calMonth = 0; calYear++; }
      loadMonthCalendar();
    }

    // 載入整月的日期總覽，讓顧客一眼看出哪幾天還有空、哪幾天已滿或公休
    async function loadMonthCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '<p class="empty-note" style="grid-column:1/-1;">載入中...</p>';

      const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
      document.getElementById('calMonthLabel').textContent = `${calYear} 年 ${monthNames[calMonth]}`;

      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const startWeekday = new Date(calYear, calMonth, 1).getDay();
      const startStr = `${calYear}-${pad2(calMonth + 1)}-01`;
      const endStr = `${calYear}-${pad2(calMonth + 1)}-${pad2(daysInMonth)}`;

      const { data: dbSchedules } = await supabaseClient.from('schedules').select('*').gte('date', startStr).lte('date', endStr);
      const { data: dbBookings } = await supabaseClient.from('bookings').select('*').gte('booking_date', startStr).lte('booking_date', endStr);

      const todayStr = new Date().toISOString().split('T')[0];
      const selectedDate = document.getElementById('bookingDate').value;

      let cells = '';
      for (let i = 0; i < startWeekday; i++) {
        cells += `<div class="calendar-day empty"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${calYear}-${pad2(calMonth + 1)}-${pad2(day)}`;
        const daySchedules = (dbSchedules || []).filter(s => s.date === dateStr);
        const dayBookings = (dbBookings || []).filter(b => b.booking_date === dateStr);
        const bookedTimes = dayBookings.map(b => b.booking_time);

        const openTimes = DEFAULT_SLOTS.filter(t => {
          const sch = daySchedules.find(s => s.time_slot === t);
          return sch && sch.is_available === true;
        });
        const remainingTimes = openTimes.filter(t => !bookedTimes.includes(t));

        let statusClass, statusLabel;
        if (openTimes.length === 0) {
          statusClass = 'cal-off';
          statusLabel = '已無可預約時間';
        } else if (remainingTimes.length === 0) {
          statusClass = 'cal-full';
          statusLabel = '已無可預約時間';
        } else {
          statusClass = 'cal-open';
          statusLabel = '可預約';
        }

        const isPast = dateStr < todayStr;
        let extraClass = '';
        if (dateStr === todayStr) extraClass += ' today';
        if (dateStr === selectedDate) extraClass += ' selected';
        if (isPast) extraClass += ' cal-past';

        // 只有「可預約」且非過去的日期才能點擊
        const clickable = statusClass === 'cal-open' && !isPast;
        const clickHandler = clickable ? `onclick="selectCalendarDay('${dateStr}')"` : '';

        cells += `
          <div class="calendar-day ${statusClass}${extraClass}" ${clickHandler}>
            <div class="day-num">${day}</div>
            <div class="day-status">${statusLabel}</div>
          </div>
        `;
      }

      grid.innerHTML = cells;
    }

    // 點選月曆上的日期：帶入日期並載入該天的可預約時段
    async function selectCalendarDay(dateStr) {
      document.getElementById('bookingDate').value = dateStr;
      await loadMonthCalendar();
      loadAvailableSlots();
    }

    // 檢查 LocalStorage 記憶顧客資料（同裝置快速帶入用）
    function checkSavedCustomer() {
      const saved = localStorage.getItem('eyelash_customer');
      if (saved) {
        document.getElementById('btnQuickFill').style.display = 'inline-flex';
      }
    }

    function loadSavedCustomer() {
      const saved = JSON.parse(localStorage.getItem('eyelash_customer'));
      if (saved) {
        document.getElementById('custName').value = saved.name || '';
        document.getElementById('custPhone').value = saved.phone || '';
        document.getElementById('custLine').value = saved.line || '';
        checkReturningCustomer();
      }
    }

    // 依電話號碼查詢是否為回頭客（跨裝置有效，查詢 bookings 資料表）
    async function checkReturningCustomer() {
      const phone = document.getElementById('custPhone').value.trim();
      const note = document.getElementById('historyNote');

      if (!phone || phone.length < 8) {
        note.style.display = 'none';
        return;
      }

      const { data, error } = await supabaseClient
        .from('bookings')
        .select('customer_name, line_id, booking_date')
        .eq('customer_phone', phone)
        .order('booking_date', { ascending: false });

      if (error || !data || data.length === 0) {
        note.style.display = 'none';
        return;
      }

      // 若姓名 / LINE 欄位還是空的，自動帶入最近一次預約的資料
      const nameInput = document.getElementById('custName');
      const lineInput = document.getElementById('custLine');
      const last = data[0];
      if (!nameInput.value && last.customer_name) nameInput.value = last.customer_name;
      if (!lineInput.value && last.line_id) lineInput.value = last.line_id;

      note.style.display = 'block';
      note.innerHTML = `🌼 歡迎回來，${last.customer_name}！`;
    }

    // 載入款式與加購資料
    async function fetchStylesAndAddons() {
      const { data: styles } = await supabaseClient.from('eyelash_styles').select('*');
      const { data: addons } = await supabaseClient.from('add_ons').select('*');

      stylesData = styles || [];
      addonsData = addons || [];

      // 渲染款式單選按鈕
      const styleContainer = document.getElementById('styleOptions');
      if (stylesData.length === 0) styleContainer.innerHTML = '<p class="empty-note">尚無可選款式</p>';
      else {
        styleContainer.innerHTML = stylesData.map(s => `
          <div class="option-item">
            <label><input type="radio" name="styleSelect" value="${s.id}" onchange="updateTotal()"> ${s.name}</label>
            <span class="price">NT$ ${s.price}</span>
          </div>
        `).join('');
      }

      // 渲染加購複選按鈕
      const addonContainer = document.getElementById('addonOptions');
      if (addonsData.length === 0) addonContainer.innerHTML = '<p class="empty-note">無加購項目</p>';
      else {
        addonContainer.innerHTML = addonsData.map(a => `
          <div class="option-item">
            <label><input type="checkbox" class="addon-checkbox" value="${a.id}" onchange="updateTotal()"> ${a.name}</label>
            <span class="price">+ NT$ ${a.price}</span>
          </div>
        `).join('');
      }
    }

    // 載入指定日期的可預約時段
    async function loadAvailableSlots() {
      const date = document.getElementById('bookingDate').value;
      if (!date) return;

      selectedTimeSlot = '';
      const slotsContainer = document.getElementById('slotsContainer');
      slotsContainer.innerHTML = '載入中...';

      // 預設常見時段
      const defaultSlots = ['9:00', '9:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00', '19:30', '20:00'];

      // 查詢資料庫該日期排程與已預約資料
      const { data: dbSchedules } = await supabaseClient.from('schedules').select('*').eq('date', date);
      const { data: dbBookings } = await supabaseClient.from('bookings').select('booking_time').eq('booking_date', date);

      const bookedSlots = dbBookings ? dbBookings.map(b => b.booking_time) : [];

      // 只顯示真的有開放且尚未被預約的時段，不列出公休/已額滿的常見時段
      const openSlots = defaultSlots.filter(time => {
        const schedule = dbSchedules?.find(s => s.time_slot === time);
        const isOff = !(schedule && schedule.is_available === true);
        const isBooked = bookedSlots.includes(time);
        return !isOff && !isBooked;
      });

      if (openSlots.length === 0) {
        slotsContainer.innerHTML = '<p class="empty-note" style="grid-column: 1/-1;">這天目前沒有可預約的時段</p>';
        return;
      }

      slotsContainer.innerHTML = openSlots.map(time => {
        return `<div class="slot-btn" onclick="selectSlot(this, '${time}')">${time}</div>`;
      }).join('');
    }

    function selectSlot(btn, time) {
      document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedTimeSlot = time;
    }

    // 計算總金額
    function updateTotal() {
      let total = 0;
      const selectedStyleId = document.querySelector('input[name="styleSelect"]:checked')?.value;
      if (selectedStyleId) {
        selectedStyle = stylesData.find(s => s.id === selectedStyleId);
        if (selectedStyle) total += Number(selectedStyle.price);
      }

      selectedAddons = [];
      document.querySelectorAll('.addon-checkbox:checked').forEach(cb => {
        const addon = addonsData.find(a => a.id === cb.value);
        if (addon) {
          selectedAddons.push(addon);
          total += Number(addon.price);
        }
      });

      document.getElementById('totalPrice').innerText = total;
    }

    // 送出預約單
    async function submitBooking() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const line = document.getElementById('custLine').value.trim();
      const date = document.getElementById('bookingDate').value;

      if (!name || !phone) { alert('請填寫姓名與電話！'); return; }
      if (!date || !selectedTimeSlot) { alert('請選擇日期與預約時段！'); return; }
      if (!selectedStyle) { alert('請選擇美睫款式！'); return; }

      const total = document.getElementById('totalPrice').innerText;

      // 儲存顧客資料至本地儲存區 (同裝置快速帶入)
      localStorage.setItem('eyelash_customer', JSON.stringify({ name, phone, line }));

      // 寫入 Supabase
      const { error } = await supabaseClient.from('bookings').insert([{
        customer_name: name,
        customer_phone: phone,
        line_id: line,
        booking_date: date,
        booking_time: selectedTimeSlot,
        style_id: selectedStyle.id,
        style_name: selectedStyle.name,
        add_ons: selectedAddons,
        total_price: Number(total),
        source: trafficSource,
        line_user_id: lineProfile ? lineProfile.userId : null,
        line_display_name: lineProfile ? lineProfile.displayName : null
      }]);

      if (error) {
        alert('預約失敗：' + error.message);
      } else {
        // 組出一段可以直接傳送/複製的預約摘要
        const addonText = selectedAddons.length ? selectedAddons.map(a => a.name).join('、') : '無';
        lastBookingSummary =
          `【美睫預約通知】\n` +
          `姓名：${name}\n` +
          `電話：${phone}\n` +
          `日期：${date} ${selectedTimeSlot}\n` +
          `款式：${selectedStyle.name}\n` +
          `加購：${addonText}\n` +
          `金額：NT$ ${total}`;

        document.getElementById('confirmSummary').textContent = lastBookingSummary;
        document.getElementById('formCard4').style.display = 'none';
        document.getElementById('confirmCard').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // 如果客人是從 LINE 進來、且已透過 LIFF 抓到身份，自動推播預約成功訊息
        // （沒抓到身份或沒設定 Edge Function 網址時，會自動略過，改用手動傳送按鈕）
        if (lineProfile && lineProfile.userId && LINE_PUSH_FUNCTION_URL) {
          fetch(LINE_PUSH_FUNCTION_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: lineProfile.userId, message: lastBookingSummary })
          }).catch(e => console.warn('LINE 自動推播失敗，客人仍可使用手動傳送按鈕：', e));
        }
      }
    }

    // 一鍵把預約摘要傳到 LINE（打開 LINE 對話並帶入文字，客人按送出即可，完全免費）
    function sendToLine() {
      if (!LINE_OA_ID || LINE_OA_ID.includes('@525kfdtx')) {
        alert('店家尚未設定 LINE 官方帳號，請改用下方「複製預約摘要」傳送給我們。');
        return;
      }
      const url = `https://line.me/R/oaMessage/${encodeURIComponent(LINE_OA_ID)}/?${encodeURIComponent(lastBookingSummary)}`;
      window.open(url, '_blank');
    }

    // 複製預約摘要，讓客人可以貼到 LINE、IG 私訊、簡訊等任何管道（通用備案）
    async function copySummary() {
      try {
        await navigator.clipboard.writeText(lastBookingSummary);
        alert('已複製預約摘要！可以貼到 LINE、IG 私訊或簡訊傳送給我們 😊');
      } catch {
        alert('複製失敗，請手動選取以下文字：\n\n' + lastBookingSummary);
      }
    }
  </script>
</body>
</html>
